version: "3.8"
services:
  jekyll:
    build: .
    ports:
      - "4000:4000"
    volumes:
      - .:/srv/jekyll:cached
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: ["sh", "-c", "bundle check || bundle install --jobs 4 --retry 3 && bundle exec jekyll serve --host 0.0.0.0 --watch --force_polling"]

volumes:
  bundle_cache:
