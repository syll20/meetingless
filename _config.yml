title: meetingless
description: a framework for productivity
show_downloads: false
google_analytics:
github.is_project_page: false
remote_theme: pages-themes/slate@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-polyglot

# Multilingual (jekyll-polyglot) configuration
languages: ["en", "fr"]
default_lang: "en"
exclude_from_localization: ["assets", "images", "css", "sitemap.xml", "CNAME"]
parallel_localization: false
fallback_canonical_to_default_lang: true

# NOTE: update `url` to your production site URL (used by polyglot for correct
# absolute/alternate links). Example: https://<user>.github.io/<repo>
url: "https://syll20.github.io/meetingless"